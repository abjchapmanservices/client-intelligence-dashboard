# Daily sync workflow will go here
name: Client Intelligence Test

on:
  workflow_dispatch:

jobs:

  run-dashboard:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Packages
        run: npm install


      - name: Run Script
        run: npm run backfill
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}

          TEAMWORK_API_KEY: ${{ secrets.TEAMWORK_API_KEY }}

          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_REFRESH_TOKEN: ${{ secrets.QUICKBOOKS_REFRESH_TOKEN }}
          QUICKBOOKS_REALM_ID: ${{ secrets.QUICKBOOKS_REALM_ID }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}

      - name: Update QuickBooks Refresh Token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.QUICKBOOKS_SECRET_UPDATE_TOKEN }}
        run: |
          if [ -f /tmp/quickbooks_refresh_token ]; then
            gh secret set QUICKBOOKS_REFRESH_TOKEN \
              --repo "${{ github.repository }}" \
              --body "$(cat /tmp/quickbooks_refresh_token)"

            rm -f /tmp/quickbooks_refresh_token

            echo "QuickBooks refresh token updated successfully."
          else
            echo "No new QuickBooks refresh token to save."
          fi
